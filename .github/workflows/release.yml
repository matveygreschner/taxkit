name: Release skills
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/build_skills.py
      - name: Publish release with skill archives and workbook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.skill workbook/TaxKit.xlsx \
            --title "TaxKit $GITHUB_REF_NAME" --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.skill workbook/TaxKit.xlsx --clobber
