name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (worked examples + portability + workbook smoke test)
        run: python -m pytest -q
      - name: Rebuild workbook and verify against the engine (fuzzed)
        run: |
          PYTHONPATH=src python -m taxkit build workbook/TaxKit.xlsx
          python scripts/verify_workbook.py workbook/TaxKit.xlsx --fuzz 40
      - name: Skills are valid and in sync with src/
        run: python scripts/build_skills.py --check
      - name: Committed workbook is up to date
        run: git diff --exit-code --stat workbook/TaxKit.cells.json
  test-py39:
    # the oldest Python the README and pyproject promise; no longer on the hosted runner image
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
